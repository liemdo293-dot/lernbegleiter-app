<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">

  <!-- Als App installierbar: Steckbrief, Symbol und iPhone-Einstellungen -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="bilder/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="bilder/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lernbegleiter">
  <title>Lernbegleiter</title>

  <!-- Farbschema sofort setzen, damit die Seite nicht kurz in der falschen Farbe aufblitzt -->
  <script>
    try {
      const modus = (JSON.parse(localStorage.getItem("lb-einstellungen")) || {}).theme || "dunkel";
      const hell = modus === "hell" || (modus === "auto" && matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.dataset.theme = hell ? "light" : "dark";
    } catch (fehler) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>

  <!-- Schrift „Inter“: sieht auf Windows fast aus wie Apples Systemschrift -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- Die drei Hauptansichten. Ihr Inhalt wird von js/app.js erzeugt. -->
    <main class="ansichten">
      <section class="ansicht" id="ansicht-heute" data-ansicht="heute"></section>
      <section class="ansicht" id="ansicht-woche" data-ansicht="woche"></section>
      <section class="ansicht" id="ansicht-aufgaben" data-ansicht="aufgaben"></section>
      <section class="ansicht" id="ansicht-klausuren" data-ansicht="klausuren"></section>
      <section class="ansicht" id="ansicht-faecher" data-ansicht="faecher"></section>
    </main>

    <!-- Die Fachseite, die von rechts hereingleitet -->
    <section class="detail" id="detail" aria-hidden="true"></section>

    <!-- Fenster für neue Hausaufgaben, gleitet von unten herein -->
    <div class="sheet-hintergrund" id="sheet-hintergrund" data-aktion="sheet-zu"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Neue Hausaufgabe" aria-hidden="true"></section>

    <!-- Lern-Timer im Vollbild und als kleine Pille, wenn er minimiert ist -->
    <section class="timer" id="timer" role="dialog" aria-modal="true" aria-label="Lern-Timer" aria-hidden="true"></section>
    <!-- Quiz im Vollbild -->
    <section class="quiz" id="quiz" role="dialog" aria-modal="true" aria-label="Quiz" aria-hidden="true"></section>

    <button class="timer-mini" id="timer-mini" data-aktion="timer-auf" aria-label="Lern-Timer öffnen" aria-hidden="true"></button>

    <!-- Unsichtbares Feld zum Auswählen einer Backup- oder Stundenplan-Datei -->
    <input type="file" id="backup-datei" accept=".json,application/json" hidden>

    <!-- Kurze Rückmeldung oben, z. B. „Gespeichert“ -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Navigationsleiste unten -->
    <nav class="tabbar" aria-label="Hauptnavigation">
      <span class="tabbar-indikator"></span>
      <button class="tab" data-ziel="heute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
        Heute
      </button>
      <button class="tab" data-ziel="woche">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        Woche
      </button>
      <button class="tab" data-ziel="aufgaben">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l1.6 1.6L8.5 5M4 12.5l1.6 1.6 2.9-3.1M4 18.5l1.6 1.6 2.9-3.1M12 7h8M12 13h8M12 19h8"/></svg>
        Aufgaben
      </button>
      <button class="tab" data-ziel="klausuren">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2.5 2.5 0 0 0-2.5 2.5v13A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V8.5z"/><path d="M14 3v5.5h5.5M8.5 13h7M8.5 17h4.5"/></svg>
        Klausuren
      </button>
      <button class="tab" data-ziel="faecher">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg>
        Fächer
      </button>
    </nav>
  </div>

  <script src="js/daten.js"></script>
  <script src="js/app.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/backup.js"></script>
  <script>
    // Offline-Speicher einschalten – nur wenn die App aus dem Internet kommt, nicht per Doppelklick
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
